# Level 0: Linear baseline on primitives-only (14K episodes)
# Can a linear model learn clean physics from structured primitives?
arch: linear
arch_params: {}
prediction: delta
training_mode: single_step
rollout_k: 1
data_mix: primitives
data_path:
  - /media/hdd1/physics-priors-latent-space/lunar-lander-data/world_model_data/primitives-v1
state_dim: 6
dim_names: [x, y, vx, vy, angle, angular_vel]
dim_weights: inv_var
subsample: 5
action_dim: 2
lr: 0.001
batch_size: 64
epochs: 50
val_fraction: 0.1
# Callback frequencies
val_every: 2000
patience: 50
ckpt_every: 5000
plot_every: 10000
grad_norm_every: 200
rollout_every: 10000
rollout_n_rollouts: 20
grad_clip: 1.0
run_dir: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/world-model-ladder-runs
