# mlp-force3-single_step_k1-primitives.yaml
# E2-25: MLP with 3D force targets [Δvx, Δvy, Δang_vel]
# Same architecture as mlp-single-step-gym-default but predicts only velocity deltas.
# Position dims are integrated analytically during rollout.
arch: mlp
arch_params:
  hidden_dims: [256, 256]
  activation: relu
prediction: delta
training_mode: single_step
rollout_k: 1
suffix: force3
data_mix: primitives
data_path: /media/hdd1/physics-priors-latent-space/lunar-lander-data/world_model_data/primitives-v1
state_dim: 6
delta_dim: 3
dim_names: [dvx, dvy, dang_vel]
dim_weights: inv_var
subsample: 5
action_dim: 2
lr: 0.001
batch_size: 256
epochs: 200
val_fraction: 0.1
val_every: 500
patience: 15
ckpt_every: 5000
plot_every: 10000
grad_norm_every: 200
rollout_every: 10000
rollout_n_rollouts: 20
grad_clip: 1.0
run_dir: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/world-model-ladder-runs
