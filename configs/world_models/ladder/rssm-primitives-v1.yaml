# Level 4: RSSM on primitives-only (14K episodes)
# Does stochastic latent help with primitive dynamics?
arch: rssm
arch_params:
  deter_dim: 200
  stoch_dim: 30
  hidden_dim: 200
prediction: delta
training_mode: elbo
rollout_k: 10
kl_weight: 1.0
data_mix: primitives
data_path:
  - /media/hdd1/physics-priors-latent-space/lunar-lander-data/world_model_data/primitives-v1
state_dim: 6
dim_names: [x, y, vx, vy, angle, angular_vel]
dim_weights: inv_var
subsample: 5
action_dim: 2
seq_len: 20
lr: 0.0003
batch_size: 32
epochs: 100
val_fraction: 0.1
# Callback frequencies
val_every: 500
patience: 50
ckpt_every: 10000
plot_every: 20000
grad_norm_every: 1000
rollout_every: 20000
rollout_n_rollouts: 10
grad_clip: 1.0
run_dir: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/world-model-ladder-runs
