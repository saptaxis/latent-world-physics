# Level 1: MLP single-step on full gym-default mix (41K episodes)
# Expected: very low 1-step MSE, rollout degradation past h=10-20.
# The PETS baseline: can a stateless net learn the transition function?
# ~160K steps/epoch, 100 epochs = 16M total steps.
arch: mlp
arch_params:
  hidden_dims: [256, 256]
  activation: relu
prediction: delta
training_mode: single_step
rollout_k: 1
data_mix: policy
data_path: /media/hdd1/physics-priors-latent-space/lunar-lander-data/world_model_data/gym-default
state_dim: 6
dim_names: [x, y, vx, vy, angle, angular_vel]
dim_weights: inv_var
subsample: 5
action_dim: 2
lr: 0.001
batch_size: 64
epochs: 100
val_fraction: 0.1
# Callback frequencies
val_every: 2000
patience: 15
ckpt_every: 5000
plot_every: 10000
grad_norm_every: 200
rollout_every: 10000
rollout_n_rollouts: 20
grad_clip: 1.0
run_dir: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/world-model-ladder-runs
