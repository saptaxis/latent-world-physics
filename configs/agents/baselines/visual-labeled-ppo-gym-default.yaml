# Visual-labeled agent + PPO on fixed Gymnasium default physics.
# Dict obs: {"image": (84,84,4), "physics": (7,)} via MultiInputPolicy.
#
# Same CNN encoder as visual-blind (NatureCNN -> 512D), physics params
# concatenated after encoder: 512 + 7 = 519D -> 128 -> 128 -> actions.
# This is the visual analogue of state-vector "labeled" — the parametric
# trap test through a perception layer.
#
# PPO hyperparams: RL Zoo Atari preset (same as visual-blind for fair comparison).
variant: visual-labeled
algo: ppo
profile: gym-default
total_steps: 5_000_000
n_stack: 4
video_freq: 500_000
early_stop_landed_pct: 90.0
early_stop_patience: 5
n_envs: 8

# --- PPO hyperparams (RL Zoo Atari-style for CNN) ---
learning_rate: 2.5e-4
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.01

# 2x128 MLP head after CNN features — matches Expt 1 state-vector agents.
net_arch: [128, 128]
