# Visual-blind agent + PPO on fixed Gymnasium default physics.
# 128x128 frames, IMPALA ResNet backbone, linear LR decay.
# Auxiliary kinematic prediction head: CNN features -> [x,y,vx,vy,angle,ang_vel].
# Forces encoder to learn physics-relevant features (especially angle).
# Control: visual-ppo-gym-default-128px-impala-lrdecay.yaml (no aux).
variant: visual
algo: ppo
profile: gym-default
total_steps: 10_000_000
n_stack: 4
frame_size: 128
cnn_backbone: impala
video_freq: 500_000
early_stop_landed_pct: 95.0
early_stop_patience: 5
n_envs: 8

# --- PPO hyperparams ---
learning_rate: 2.5e-4
lr_schedule: linear
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.01

# --- Auxiliary loss ---
aux_kinematic: true
aux_coef: 0.1

# 2x128 MLP head after CNN features.
net_arch: [128, 128]
