# Visual-blind agent + PPO on fixed Gymnasium default physics.
# Pure SB3 defaults with RL Zoo Atari-style PPO hyperparams.
# No net_arch override — CnnPolicy default (CNN → 512 → linear to actions).
# ent_coef: SB3 default (0.0) — no entropy bonus.
#
# PPO hyperparams from RL Zoo Atari preset — tuned for CNN feature extraction.
# State-vector PPO_DEFAULTS (n_steps=1024, batch_size=64) cause KL explosion
# and entropy collapse when used with CNN policies.
variant: visual
algo: ppo
profile: gym-default
total_steps: 5_000_000
n_stack: 4
video_freq: 500_000
early_stop_landed_pct: 90.0
early_stop_patience: 5
n_envs: 8

# --- PPO hyperparams (RL Zoo Atari-style for CNN) ---
learning_rate: 2.5e-4
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.0
