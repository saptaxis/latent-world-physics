# Visual-blind agent + PPO on fixed Gymnasium default physics.
# 256x256 frame resolution — testing whether 128x128 is still too small.
# NatureCNN flatten dim: ~43264, total CNN params: ~25.8M.
# WARNING: much larger model, may need lower learning rate if unstable.
#
# PPO hyperparams: RL Zoo Atari preset (same as 128px for fair comparison).
variant: visual
algo: ppo
profile: gym-default
total_steps: 5_000_000
n_stack: 4
frame_size: 256
video_freq: 500_000
early_stop_landed_pct: 90.0
early_stop_patience: 5
n_envs: 8

# --- PPO hyperparams (RL Zoo Atari-style for CNN) ---
learning_rate: 2.5e-4
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.01

# 2x128 MLP head after CNN features — matches Expt 1 state-vector agents.
net_arch: [128, 128]
