# Arch sweep: combined wider channels [32,64,64] + pool(8,8).
# Best-of-both: more feature capacity AND more spatial resolution.
# Flatten: 64*8*8=4096. Most params of any sweep config.
variant: visual
algo: ppo
profile: gym-default
total_steps: 10_000_000
n_stack: 4
frame_size: 128
cnn_backbone: impala
cnn_channels: [32, 64, 64]
cnn_pool_size: 8
video_freq: 500_000
early_stop_landed_pct: 95.0
early_stop_patience: 5
n_envs: 8

# --- PPO hyperparams ---
learning_rate: 2.5e-4
lr_schedule: linear
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.01

net_arch: [128, 128]
