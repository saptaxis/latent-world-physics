# Visual-LABELED + kinematic-pretrained FROZEN encoder + BRANCH physics fusion.
# MLP sees 256D CNN features + 32D physics branch = 288D input.
# Same encoder as blind visual — the only difference is physics info
# projected through a dedicated branch before concatenation.
# Tests the parametric trap through pixels with fair architecture.
variant: visual-labeled
algo: ppo
profile: easy
total_steps: 10_000_000
n_stack: 4
frame_size: 128
cnn_backbone: impala
video_freq: 500_000
early_stop_landed_pct: 95.0
early_stop_patience: 5
n_envs: 8

# --- PPO hyperparams ---
learning_rate: 5.0e-5
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.01

net_arch: [128, 128]

# --- Pre-trained encoder ---
encoder_weights: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/encoder-pretrain/easy/6d/s42/best_encoder.pt
freeze_encoder: true

# --- Physics branch ---
# Dedicated MLP for physics params: normalize → Linear(7, 32) → ReLU.
# Normalization stats computed automatically from the easy profile at
# training time (10K samples → per-dim mean/std).
physics_branch_dim: 32
