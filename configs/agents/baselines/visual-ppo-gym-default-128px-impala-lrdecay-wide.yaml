# Arch sweep: wider IMPALA channels [32, 64, 64] (vs default [16, 32, 32]).
# More feature capacity for fine spatial details (angle, orientation).
# ~4x CNN params, same pool/features_dim.
variant: visual
algo: ppo
profile: gym-default
total_steps: 10_000_000
n_stack: 4
frame_size: 128
cnn_backbone: impala
cnn_channels: [32, 64, 64]
video_freq: 500_000
early_stop_landed_pct: 95.0
early_stop_patience: 5
n_envs: 8

# --- PPO hyperparams ---
learning_rate: 2.5e-4
lr_schedule: linear
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.01

net_arch: [128, 128]
