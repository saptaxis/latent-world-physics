# History agent + PPO on easy with 3x256 net, entropy bonus REMOVED.
# labeled: ~59%, blind: 68%. Zero entropy helps blind at this scale.
# With 120D input, the network has more to learn from — does noent help commit?
variant: history
algo: ppo
profile: easy
total_steps: 4_000_000
video_freq: 250_000
run_dir: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/rl_agents/full-variation/history-ppo-easy-noent-256
n_envs: 8
ent_coef: 0.0
history_k: 8

# Research network: separate 3x256 actor and critic (~200K params).
net_arch:
  pi: [256, 256, 256]
  vf: [256, 256, 256]
