# History agent + PPO on easy with 2x64 net (default ent_coef=0.01).
# labeled: 85%, blind: 28%. Blind-small with default ent failed badly.
# History's 120D input on a 64-unit net is very capacity-constrained.
variant: history
algo: ppo
profile: easy
total_steps: 4_000_000
video_freq: 250_000
run_dir: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/rl_agents/full-variation/history-ppo-easy-small
n_envs: 8
history_k: 8

# RL Zoo default: 2 hidden layers of 64 units (shared actor/critic).
net_arch: [64, 64]
