# History agent + PPO on easy with 2x128 net (default ent_coef=0.01).
# labeled: 76%, blind: 52%. Default ent hurts both at this scale.
# History's larger input (120D) may interact differently with entropy.
variant: history
algo: ppo
profile: easy
total_steps: 4_000_000
video_freq: 250_000
run_dir: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/rl_agents/full-variation/history-ppo-easy-128
n_envs: 8
history_k: 8

# Intermediate: 2 hidden layers of 128 units (shared actor/critic, ~32K params).
net_arch: [128, 128]
