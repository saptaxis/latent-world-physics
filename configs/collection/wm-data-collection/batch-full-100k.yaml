# Batch config for full 100K world model dataset collection
#
# Dataset composition:
#   30K - blind agents (5 seeds × 6K)
#   20K - labeled agents (4 seeds × 5K)
#   20K - heuristic controller
#   20K - random policy
#   10K - noisy experts (2 seeds × 5K)
#  -----
#  100K total episodes

output_base: /media/hdd1/physics-priors-latent-space/lunar-lander-data/world_model_data/full-variation

collections:
  # Blind agents: 5 seeds × 6K = 30K episodes
  - config: blind-s42.yaml
  - config: blind-s123.yaml
  - config: blind-s456.yaml
  - config: blind-s789.yaml
  - config: blind-s1024.yaml

  # Labeled agents: 4 seeds × 5K = 20K episodes
  - config: labeled-s42.yaml
  - config: labeled-s123.yaml
  - config: labeled-s456.yaml
  - config: labeled-s789.yaml

  # Heuristic controller: 20K episodes
  - config: heuristic.yaml

  # Random policy: 20K episodes
  - config: random.yaml

  # Noisy experts: 2 seeds × 5K = 10K episodes
  - config: noisy-expert-s42.yaml
  - config: noisy-expert-s123.yaml
