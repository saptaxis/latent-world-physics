# Encoder pre-training data: heuristic PD controller with RGB frames.
# 2500 episodes, gym-default physics. Provides clean descent trajectories
# complementing random policy's tumbling/diverse angle coverage.

source_type: heuristic
n_episodes: 2500
seed: 0
deterministic: true
save_frames: true

physics_sampling:
  ranges:
    gravity: [-10.0, -10.0]
    main_engine_power: [13.0, 13.0]
    side_engine_power: [0.6, 0.6]
    lander_density: [5.0, 5.0]
    angular_damping: [0.0, 0.0]
    wind_power: [15.0, 15.0]
    turbulence_power: [1.5, 1.5]
