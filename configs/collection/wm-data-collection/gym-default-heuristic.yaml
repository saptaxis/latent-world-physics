# World model data collection: heuristic controller on fixed gym-default physics
# Reduced from 20K — fixed physics needs less coverage than full variation.

source_type: heuristic
n_episodes: 10000
seed: 0
deterministic: true
save_frames: false

physics_sampling:
  ranges:
    gravity: [-10.0, -10.0]
    main_engine_power: [13.0, 13.0]
    side_engine_power: [0.6, 0.6]
    lander_density: [5.0, 5.0]
    angular_damping: [0.0, 0.0]
    wind_power: [15.0, 15.0]
    turbulence_power: [1.5, 1.5]
