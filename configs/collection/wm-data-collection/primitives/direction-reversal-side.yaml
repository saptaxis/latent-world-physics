source_type: primitive
n_episodes: 200
max_steps: 1000
physics_sampling:
  profile: gym-default

maneuver:
  type: direction_reversal
  channel: side
  thrust_level: 1.0
  first_duration: [10, 50]
  gap_duration: [0, 20]
  second_duration: [10, 50]

start:
  mode: fresh_reset
  initial_state:
    x: [-0.2, 0.2]
    y: [1.0, 1.4]
    vx: [-0.5, 0.5]
    vy: [-0.5, 0.2]
    angle: [-0.15, 0.15]
    angular_vel: [-0.15, 0.15]
