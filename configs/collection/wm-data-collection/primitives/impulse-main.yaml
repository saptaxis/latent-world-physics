source_type: primitive
n_episodes: 2000
max_steps: 1000
seed: 10000
physics_sampling:
  profile: gym-default

maneuver:
  type: impulse
  channel: main
  thrust_level: 1.0
  pulse_duration: [5, 50]
  gap_duration: [5, 50]
  n_cycles: [2, 5]

start:
  mode: fresh_reset
  initial_state:
    x: [-0.6, 0.6]
    y: [0.5, 1.4]
    vx: [-0.8, 0.8]
    vy: [-0.8, 0.3]
    angle: [-0.5, 0.5]
    angular_vel: [-0.3, 0.3]
