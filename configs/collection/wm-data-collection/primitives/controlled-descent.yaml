source_type: primitive
n_episodes: 200
max_steps: 1000
physics_sampling:
  profile: gym-default

maneuver:
  type: controlled_descent
  main: [0.2, 0.4]

start:
  mode: fresh_reset
  initial_state:
    x: [-0.3, 0.3]
    y: [0.5, 1.0]
    vx: [-0.5, 0.5]
    vy: [-0.5, 0.0]
    angle: [-0.3, 0.3]
    angular_vel: [-0.2, 0.2]
