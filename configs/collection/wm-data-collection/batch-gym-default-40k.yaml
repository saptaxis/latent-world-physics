# Sanity check batch: fixed Gymnasium default physics (no randomization).
# Tests whether the dynamics MLP can learn a single physics configuration
# before we ask it to handle variation + encoder identification.
#
# Uses gym-default trained agents (single seed each — only baselines we
# have) plus heuristic + random. If we need more policy diversity later,
# train multi-seed gym-default agents or add the full-variation agents
# (they work fine as behavior policies on fixed physics).
#
# Dataset composition:
#   6K  - blind gym-default agent (1 seed)
#   5K  - labeled gym-default agent (1 seed)
#   5K  - noisy expert from blind agent (σ 0.01–0.5)
#   5K  - noisy expert from labeled agent (σ 0.01–0.5)
#   10K - heuristic controller
#   10K - random policy
#  -----
#  ~41K total episodes

output_base: /media/hdd1/physics-priors-latent-space/lunar-lander-data/world_model_data/gym-default

physics_sampling:
  ranges:
    gravity: [-10.0, -10.0]
    main_engine_power: [13.0, 13.0]
    side_engine_power: [0.6, 0.6]
    lander_density: [5.0, 5.0]
    angular_damping: [0.0, 0.0]
    wind_power: [15.0, 15.0]
    turbulence_power: [1.5, 1.5]

collections:
  - config: gym-default-blind.yaml
  - config: gym-default-labeled.yaml
  - config: gym-default-noisy-blind.yaml
  - config: gym-default-noisy-labeled.yaml
  - config: gym-default-heuristic.yaml
  - config: gym-default-random.yaml
