# Article 1: "What Do RL Agents Actually Learn About Their World?"
# Companion video manifest — landscape 1080p, clipcompose format.
#
# Migrated from v1 manifest. Same videos and annotations, new schema.
# Render each section individually, then assemble with assembly manifest.

video:
  resolution: [1920, 1080]
  fps: 30
  background: "#1A1A1A"

paths:
  videos: "/media/hdd1/physics-priors-latent-space/lunar-lander-networks/articles/01-what-do-agents-learn/videos"

colors:
  blind: "#e04c77"
  labeled: "#888888"
  neutral: "#888888"
  accent: "#B1134D"
  text: "#D5D5D3"
  text_secondary: "#888888"
  highlight: "#FF4C87"
  landed: "#50DC78"
  crashed: "#F04646"

sections:
  # ── Section 0: Title Card ────────────────────────────────────────
  - template: title_card
    label: intro
    title: "Latent World Geometry"
    subtitle: "Article 1: What Do RL Agents\nActually Learn About Their World?"
    duration: 4

  # ── Section 1: Gravity Demo ──────────────────────────────────────
  - template: grid_2x1
    label: demo-gravity
    header: "The Physics: Parameters That Shape the World"
    subtitle: "Gravity [environment]"
    clips:
      - path: "${videos}/physics-demos/gravity-low.mp4"
        annotation_side: above
        annotations:
          - text: "Low gravity — floats slowly"
      - path: "${videos}/physics-demos/gravity-high.mp4"
        annotation_side: above
        annotations:
          - text: "High gravity — slams down"

  # ── Section 2: Wind Demo ─────────────────────────────────────────
  - template: grid_2x1
    label: demo-wind
    header: "The Physics: Parameters That Shape the World"
    subtitle: "Wind [environment]"
    clips:
      - path: "${videos}/physics-demos/wind-low.mp4"
        annotation_side: above
        annotations:
          - text: "No wind — drops straight"
      - path: "${videos}/physics-demos/wind-high.mp4"
        annotation_side: above
        annotations:
          - text: "Strong wind — blown sideways"

  # ── Section 3: Turbulence Demo ───────────────────────────────────
  - template: grid_2x1
    label: demo-turbulence
    header: "The Physics: Parameters That Shape the World"
    subtitle: "Turbulence [environment]"
    clips:
      - path: "${videos}/physics-demos/turbulence-low.mp4"
        annotation_side: above
        annotations:
          - text: "No turbulence — smooth descent"
      - path: "${videos}/physics-demos/turbulence-high.mp4"
        annotation_side: above
        annotations:
          - text: "High turbulence — jittery wobble"

  # ── Section 4: Angular Damping Demo ──────────────────────────────
  - template: grid_2x1
    label: demo-angular-damping
    header: "The Physics: Parameters That Shape the World"
    subtitle: "Angular Damping [lander]"
    clips:
      - path: "${videos}/physics-demos/angular_damping-low.mp4"
        annotation_side: above
        annotations:
          - text: "High damping — stays upright"
      - path: "${videos}/physics-demos/angular_damping-high.mp4"
        annotation_side: above
        annotations:
          - text: "Zero damping — spins freely"

  # ── Section 5: Engine Power Demo ─────────────────────────────────
  - template: grid_2x1
    label: demo-engine-power
    header: "The Physics: Parameters That Shape the World"
    subtitle: "Engine Power [lander]"
    clips:
      - path: "${videos}/physics-demos/engine_power-low.mp4"
        annotation_side: above
        annotations:
          - text: "Weak engine — struggles"
      - path: "${videos}/physics-demos/engine_power-high.mp4"
        annotation_side: above
        annotations:
          - text: "Strong engine — hovers easily"

  # ── Section 6: Grid 1 — Two Strategies (paired 2x2) ─────────────
  - template: paired_2x2
    label: two-strategies
    header: "Two Strategies: How Agents Fly Differently"
    groups:
      - header: "LABELED — smooth arcs, anticipatory control (78% landed)"
        clips:
          - path: "${videos}/grid1/rendered-labeled/episode_0014.mp4"
            annotation_side: above
            annotations:
              - text: "LABELED"
                color: "#888888"
                weight: bold
              - text: "LANDED"
                color: "#50DC78"
                weight: bold
          - path: "${videos}/grid1/rendered-labeled/episode_0052.mp4"
            annotation_side: above
            annotations:
              - text: "LABELED"
                color: "#888888"
                weight: bold
              - text: "LANDED"
                color: "#50DC78"
                weight: bold
          - path: "${videos}/grid1/rendered-labeled/episode_0053.mp4"
