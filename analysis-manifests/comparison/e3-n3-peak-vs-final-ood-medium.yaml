# Peak vs final within each condition, OOD on medium profile.
# Tests: did encoder features needed for OOD exist at peak and get lost by final?
# N=3 (s42, s123, s456). 100 eps, matched encoders.
# Requires trajectories-peak-medium symlinks.
experiment: e3-n3-peak-vs-final-ood-medium
description: "E3 easy-trained N=3: peak vs final per condition, OOD on medium — what OOD capability is lost?"
output_base: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/analysis/cross-config/e3-n3-peak-vs-final-ood-medium

comparisons:
  blind-frozen-peak-vs-final:
    condition: blind-frozen
    profile: medium
    configs:
      peak:
        seed_base: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/visual_rl_agents/easy/matched-encoder/frozen-lowlr
        seeds: [42, 123, 456]
        trajectory_subdir: trajectories-peak-medium
      final:
        seed_base: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/visual_rl_agents/easy/matched-encoder/frozen-lowlr
        seeds: [42, 123, 456]
        trajectory_subdir: trajectories-medium

  blind-ft-peak-vs-final:
