# Reproducibility verification: original trajectories vs re-collected trajectories-v2.
# All stats should match (same deterministic policy, same env seeds).
# Full-variation only (easy + medium, labeled + blind = 4 comparisons).
experiment: reproducibility-verification
description: "Verify trajectory collection reproducibility: original vs v2"
output_base: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/analysis/cross-config/reproducibility-verification

comparisons:
  full-variation-easy-labeled:
    condition: full-variation
    profile: easy
    configs:
      original:
        seed_base: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/rl_agents/parametric-vs-behavioral/full-variation/labeled-ppo-easy-128-lowent
        seeds: [42, 123, 456, 789, 1024, 2048, 4096, 8192, 16384, 32768]
        trajectory_subdir: trajectories
