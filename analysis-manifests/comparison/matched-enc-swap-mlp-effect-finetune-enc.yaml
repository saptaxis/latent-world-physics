description: "Swap MLP under finetune encoder, matched independent encoders (N=5, 200 eps)"
output_base: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/analysis/cross-config/matched-enc-swap-mlp-effect-finetune-enc

comparisons:
