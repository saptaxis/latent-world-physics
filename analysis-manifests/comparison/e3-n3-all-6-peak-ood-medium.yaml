# All 6 conditions at peak checkpoint, OOD on medium profile.
# N=3 (s42, s123, s456). 100 eps, matched encoders.
# Requires trajectories-peak-medium symlinks in each run dir.
experiment: e3-n3-all-6-peak-ood-medium
description: "E3 easy-trained N=3: all 6 conditions at peak, evaluated OOD on medium physics"
output_base: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/analysis/cross-config/e3-n3-all-6-peak-ood-medium

